services:
  census:
    build: .
    image: recruitinator-census
    env_file: .env          # OPENAI_API_KEY (optional: OPENAI_BASE_URL, OPENAI_MODEL)
    volumes:
      - ./data:/app/data    # census.csv — resumable progress
    restart: on-failure     # crash -> resume from census.csv; clean finish -> stay stopped
  searxng:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
    env_file: ./.env
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
